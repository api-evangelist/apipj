aid: apipj

name: apipj (MASTER BI TECNOLOGIA LTDA)

image: https://apipj.com.br/assets/og.png

description: apipj (MASTER BI TECNOLOGIA LTDA) provides a public API for Brazilian CNPJ company registry lookup. It offers free access up to 50,000
  queries per month and paid plans for higher volume. The API returns detailed company information such as legal name, registration status, address
  with IBGE code, activity, partners, Simples and MEI status, all in JSON directly from the Receita Federal dataset as of September 2026.

